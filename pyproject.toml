[project]
name = "solidsoftware-test"
version = "0.1.0"
description = "Python Flask API with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0,<4",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-flask>=1.3.0",
    "ruff>=0.17.2",
    "types-flask-migrate>=4.1.0.20260508",
]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["db"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["app", "run.py"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]
